<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEROS Media - Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="hero">
      <header class="header">
        <div class="logo-wrap">
          <img src="LogoGR.png" alt="GEROS Media Logo" class="logo" />
        </div>
        <h1 class="app-title">GEROS Media Notes</h1>
        <p class="subtitle">Your professional note-taking solution</p>
      </header>
    </section>
    <div class="container">
      <form id="note-form">
        <input type="text" id="title" placeholder="Title" required />
        <textarea id="content" placeholder="Content" required></textarea>
        <button type="submit">Add Note</button>
      </form>
      <ul id="notes-list"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>

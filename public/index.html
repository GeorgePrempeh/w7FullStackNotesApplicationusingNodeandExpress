<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GEROS Media - Notes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Bitmap_Icon_GEROS.png"
        alt="GEROS Media Logo"
        class="logo"
      />
      <h1>GEROS Media Notes</h1>
      <p class="subtitle">Your professional note-taking solution</p>
    </header>
    <div class="container">
      <form id="note-form">
        <input type="text" id="title" placeholder="Title" required />
        <textarea id="content" placeholder="Content" required></textarea>
        <button type="submit">Add Note</button>
      </form>
      <ul id="notes-list"></ul>
    </div>
    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to GEROS Media Notes</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .landing-hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(120deg, #4f8cff 0%, #a6c1ee 100%);
        color: #fff;
        text-align: center;
      }
      .landing-logo {
        width: 100px;
        height: 100px;
        margin-bottom: 1rem;
        border-radius: 20px;
        box-shadow: 0 4px 16px rgba(79, 140, 255, 0.12);
        background: #fff;
        object-fit: contain;
      }
      .landing-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 1rem;
        letter-spacing: 1px;
      }
      .landing-desc {
        font-size: 1.2rem;
        margin-bottom: 2rem;
        color: #e0e7ff;
      }
      .landing-actions {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
      }
      .landing-actions a {
        background: #fff;
        color: #007bff;
        padding: 0.8rem 2rem;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        transition: background 0.2s, color 0.2s;
      }
      .landing-actions a:hover {
        background: #007bff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="landing-hero">
      <img src="LogoGR.png" alt="GEROS Media Logo" class="landing-logo" />
      <div class="landing-title">Welcome to GEROS Media Notes</div>
      <div class="landing-desc">
        A professional, secure, and modern note-taking application for all your
        ideas and tasks.
      </div>
      <div class="landing-actions">
        <a href="register.html">Register</a>
        <a href="login.html">Login</a>
      </div>
    </div>
  </body>
</html>
